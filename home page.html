<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   viewport-fit=cover">

    <title>Airold Cabañog's Homepage</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            background: linear-gradient(
                135deg,
                blue 0%,
                magenta 30%,
                green 50%,
                orange 75%,
                cyan 100%
            );

            position: relative;
            isolation: isolate;
            overflow-x: clip;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: min(500px, 70vw);
            aspect-ratio: 1;
            left: -180px;
            bottom: -200px;
        }

        body::after {
            width: min(350px, 55vw);
            aspect-ratio: 1;
            right: -100px;
            top: -100px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            text-align: center;
        }
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .nav-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            min-height: 46px;
            padding: 12px 22px;

            background: rgba(255, 255, 255, 0.94);
            color: #444;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;

            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);

            transition: background 0.2s ease,
                        color 0.2s ease,
                        transform 0.2s ease;
        }

        .nav-btn i {
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: #fff;
            color: #163b7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }
        .welcome-card {
            width: 100%;
            padding: clamp(25px, 5vw, 45px);

            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .welcome-card h1 {
            color: #333;
            font-size: clamp(25px, 4vw, 36px);
            line-height: 1.35;
            margin-bottom: 20px;
            overflow-wrap: break-word;
        }

        .welcome-card p {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;

            color: #555;
            font-size: 16px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }
        .logout-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;

            margin-top: 28px;
            padding: 14px 28px;
            min-height: 48px;
            min-width: 150px;

            border: none;
            border-radius: 8px;

            background: #163b7a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .logout-btn:hover {
            background: #0d2855;
            transform: translateY(-2px);
        }

        .nav-btn:focus-visible,
        .logout-btn:focus-visible {
            outline: 3px solid #163b7a;
            outline-offset: 3px;
        }
        @media screen and (max-width: 768px) {
            .container {
                max-width: 650px;
            }

            .navigation {
                gap: 10px;
                margin-bottom: 24px;
            }

            .nav-btn {
                padding: 12px 17px;
            }

            .welcome-card {
                border-radius: 13px;
            }
        }
        @media screen and (max-width: 480px) {
            body {
                padding:
                    max(16px, env(safe-area-inset-top))
                    max(12px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(12px, env(safe-area-inset-left));
            }

            .container {
                width: 100%;
            }

            .navigation {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 20px;
            }

            .nav-btn {
                width: 100%;
                min-width: 0;
                min-height: 46px;
                padding: 11px 6px;
                gap: 6px;
                font-size: 14px;
            }

            .welcome-card {
                padding: 27px 18px;
                border-radius: 12px;
            }

            .welcome-card h1 {
                font-size: 25px;
                margin-bottom: 15px;
            }

            .welcome-card p {
                font-size: 14px;
                line-height: 1.85;
            }

            .logout-btn {
                width: 100%;
                max-width: 240px;
                margin-top: 22px;
                min-height: 48px;
            }
        }
        @media screen and (max-width: 320px) {
            body {
                padding: 12px 8px;
            }

            .navigation {
                gap: 7px;
            }

            .nav-btn {
                padding: 10px 4px;
                gap: 5px;
                font-size: 12px;
            }

            .welcome-card {
                padding: 22px 13px;
            }

            .welcome-card h1 {
                font-size: 22px;
            }

            .welcome-card p {
                font-size: 13px;
            }

            .logout-btn {
                font-size: 14px;
            }
        }
        @media screen and (max-height: 500px)
            and (orientation: landscape) {
            body {
                justify-content: flex-start;
            }

            .container {
                margin: 10px auto;
            }

            .navigation {
                margin-bottom: 15px;
            }

            .welcome-card {
                padding: 20px;
            }

            .welcome-card h1 {
                margin-bottom: 10px;
            }

            .logout-btn {
                margin-top: 15px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <nav class="navigation" aria-label="Main navigation">

            <a href="home page.html"
               class="nav-btn"
               aria-current="page">
                <i class="fa-solid fa-house"
                   aria-hidden="true"></i>
                Home
            </a>

            <a href="about.html" class="nav-btn">
                <i class="fa-solid fa-circle-info"
                   aria-hidden="true"></i>
                About
            </a>

            <a href="product.html" class="nav-btn">
                <i class="fa-solid fa-briefcase"
                   aria-hidden="true"></i>
                Product
            </a>

            <a href="contact.html" class="nav-btn">
                <i class="fa-solid fa-envelope"
                   aria-hidden="true"></i>
                Contact
            </a>

        </nav>
        <section class="welcome-card">

            <h1>Welcome to my Homepage!</h1>

            <p>
                Hello! My name is <strong>Airold</strong>.
                Welcome to my personal website!
                I am a hardworking and determined person who is
                willing to work hard to achieve the things I want.
            </p>

            <button
                type="button"
                class="logout-btn"
                onclick="logout()">

                <i class="fa-solid fa-right-from-bracket"
                   aria-hidden="true"></i>

                LOGOUT
            </button>

        </section>

    </main>

    <script>
        function logout() {
            const confirmLogout = confirm(
                "Are you sure you want to log out?"
            );

            if (confirmLogout) {
                alert("You have been logged out!");
                window.location.href = "index.html";
            }
        }
    </script>

</body>
</html>
