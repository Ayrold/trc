
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Airold Cabañog's Homepage</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;

            background: linear-gradient(
                135deg,
                blue 0%,
                magenta 30%,
                green 50%,
                orange 75%,
                cyan 100%
            );

            position: relative;
            overflow-x: hidden;
        }

        /* Decorative circles */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width:  min(500px, 70vw);
            height: min(500px, 70vw);
            left: -180px;
            bottom: -200px;
        }

        body::after {
            width: min(350px, 55vw);
            height: min(350px, 55vw);
            right: -100px;
            top: -100px;
        }

        /* Main content */
        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Navigation */
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .nav-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            padding: 12px 22px;
            min-height: 44px;

            background: rgba(255, 255, 255, 0.92);
            color: #555;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;

            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);

            transition: background 0.3s ease,
                        color 0.3s ease,
                        transform 0.3s ease;
        }

        .nav-btn:hover {
            background: #fff;
            color: #163b7a;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .nav-btn:focus-visible,
        .logout-btn:focus-visible {
            outline: 3px solid #163b7a;
            outline-offset: 4px;
        }

        /* Welcome card */
        .welcome-card {
            width: 100%;
            padding: 40px 30px;

            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .welcome-card h1 {
            color: #333;
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .welcome-card p {
            max-width: 700px;
            margin: 0 auto;

            color: #555;
            font-size: 16px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        /* Logout button */
        .logout-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 9px;

            margin-top: 25px;
            padding: 13px 28px;
            min-height: 46px;

            border: none;
            border-radius: 6px;

            background: #163b7a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: background 0.3s ease,
                        transform 0.3s ease;
        }

        .logout-btn:hover {
            background: #0d2855;
            transform: translateY(-2px);
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                padding: 25px 18px;
            }

            .navigation {
                gap: 10px;
                margin-bottom: 25px;
            }

            .nav-btn {
                padding: 12px 18px;
            }

            .welcome-card {
                padding: 35px 25px;
            }
        }

        /* Mobile phones */
        @media (max-width: 480px) {
            body {
                justify-content: flex-start;
                padding: 25px 15px;
            }

            .container {
                margin: auto 0;
            }

            .navigation {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 20px;
            }

            .nav-btn {
                width: 100%;
                padding: 12px 8px;
                font-size: 14px;
            }

            .welcome-card {
                padding: 30px 20px;
                border-radius: 10px;
            }

            .welcome-card h1 {
                font-size: 25px;
                margin-bottom: 16px;
            }

            .welcome-card p {
                font-size: 14px;
                line-height: 1.8;
            }

            .logout-btn {
                width: 100%;
                max-width: 220px;
                margin-top: 22px;
            }
        }

        /* Short screens in landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                justify-content: flex-start;
            }

            .container {
                margin: 10px auto;
            }

            .welcome-card {
                padding: 22px 25px;
            }

            .navigation {
                margin-bottom: 18px;
            }
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Navigation -->
        <nav class="navigation" aria-label="Main navigation">
            <a href="home page.html" class="nav-btn" aria-current="page">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
                Home
            </a>

            <a href="about.html" class="nav-btn">
                <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                About
            </a>

            <a href="product.html" class="nav-btn">
                <i class="fa-solid fa-briefcase" aria-hidden="true"></i>
                Product
            </a>

            <a href="contact.html" class="nav-btn">
                <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                Contact
            </a>
        </nav>

        <!-- Welcome section -->
        <section class="welcome-card">
            <h1>Welcome to my Homepage!</h1>

            <p>
                Hello! My name is <strong>Airold</strong>.
                Welcome to my personal website!
                I am a hardworking and determined person who is
                willing to work hard to achieve the things I want.
            </p>

            <button type="button" class="logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"
                   aria-hidden="true"></i>
                LOGOUT
            </button>
        </section>

    </main>

    <script>
        function logout() {
            const confirmLogout = confirm(
                "Are you sure you want to log out?"
            );

            if (confirmLogout) {
                alert("You have been logged out!");
                window.location.href = "index.html";
            }
        }
    </script>

</body>
</html>
