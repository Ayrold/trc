<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                yellow 0%,
                blue 30%,
                green 50%,
                pink 75%,
                black 100%
            );

            font-family: Arial, sans-serif;
        }

        /* Contact Box */
        .contact-box {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: clamp(24px, 4vw, 30px);
            margin-top: 0;
            color: #333;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }

        /* Form Labels */
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Form Fields */
        input,
        textarea {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 18px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            max-width: 100%;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }

        /* Send Message Button */
        button {
            width: 100%;
            min-height: 48px;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:focus-visible,
        .back-home:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        /* Back to Home */
        .back-home {
            display: inline-block;
            margin-top: 22px;
            color: #007bff;
            text-decoration: none;
            font-size: 16px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        /* Tablets and smaller laptops */
        @media screen and (max-width: 900px) {
            body {
                padding: 20px;
            }

            .contact-box {
                max-width: 500px;
            }
        }

        /* Cellphones */
        @media screen and (max-width: 600px) {
            body {
                min-height: 100vh;
                padding: 15px;
                align-items: center;
            }

            .contact-box {
                max-width: 100%;
                padding: 22px 18px;
                border-radius: 12px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 14px;
                line-height: 1.6;
            }

            input,
            textarea,
            button {
                font-size: 16px;
            }

            textarea {
                min-height: 100px;
            }
        }

        /* Extra-small cellphone screens */
        @media screen and (max-width: 360px) {
            body {
                padding: 10px;
            }

            .contact-box {
                padding: 18px 14px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 13px;
            }

            input,
            textarea {
                padding: 10px;
            }
        }

        /* Landscape phones */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 15px;
                padding-bottom: 15px;
            }

            .contact-box {
                margin: auto;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body>

    <div class="contact-box">
        <h1>Contact Us!</h1>

        <p>
            If you have any questions about our product,
            don't hesitate to contact us!
        </p>

        <form action="#" method="post">

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="message">Message:</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your message here"
                required
            ></textarea>

            <button type="submit">Send Message</button>

        </form>

        <a href="home page.html" class="back-home">
            Back to Home
        </a>
    </div>

</body>
</html>
