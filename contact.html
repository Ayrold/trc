<!Doctype.html>
<html>
<head>
	<title>Contact</title>
<style>
 body {
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background:
linear-gradient(
135deg,
yellow 0%,
blue 30%,
green 50%,
pink 75%,
black 100%
);
overflow: hidden;
position: relative;
}
.contact-box {
width: 450px;
margin: 100px;
padding: 30px;
background-color: white;
border-radius: 15px;
text-align: center;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0, 3,);
 }
</style>
</head>
<body>
<div class="contact-box">
	<h1>Contact Us!</h1>
	<p>If you have any questions about our product,Dont hesitate to approach us!</p>
	
	<form>
	<label>Name:<label><br>
	<input type="email" id="enter your name" placeholder="Enter your name"><br><br>
	<label>Email:</label><br>
	<input type="email" id="enter your email" placeholder="Enter your email"><br><br>
	<label>Message:</label>
	<textarea rows="5" placeholder="Write your message here"></textarea><br><br>
	<button type="submit">Send Message</button>
	</form>
	<br><br>
	<a href="home page.html">Back to Home</a>
</div>
	</body>
	</html>
