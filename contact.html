
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TRC Racing Shop</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                yellow 0%,
                blue 30%,
                green 50%,
                pink 75%,
                black 100%
            );
            overflow-x: hidden;
        }
        .site-nav {
            width: 100%;
            background: #171717;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            flex-wrap: wrap;
            border-bottom: 3px solid #d71920;
        }

        .site-nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .site-nav a:hover,
        .site-nav a.active {
            background: #d71920;
            color: white;
        }
        .page-container {
            min-height: calc(100vh - 60px);
            padding: 30px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .contact-box {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: clamp(24px, 4vw, 30px);
            margin-bottom: 15px;
            color: #333;
        }

        .intro {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input,
        textarea {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            max-width: 100%;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.3);
        }
        .send-button {
            width: 100%;
            min-height: 48px;
            padding: 14px;
            background-color: #d71920;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-button:hover {
            background-color: #a91218;
        }

        input:focus-visible,
        textarea:focus-visible,
        button:focus-visible,
        .site-nav a:focus-visible {
            outline: 3px solid #007bff;
            outline-offset: 3px;
        }
        @media screen and (max-width: 900px) {
            .contact-box {
                max-width: 500px;
            }
        }
        @media screen and (max-width: 600px) {
            .site-nav {
                gap: 4px;
                padding: 10px 6px;
            }

            .site-nav a {
                font-size: 13px;
                padding: 9px 10px;
            }

            .page-container {
                padding: 20px 15px;
            }

            .contact-box {
                max-width: 100%;
                padding: 22px 18px;
                border-radius: 12px;
            }

            h1 {
                font-size: 25px;
            }

            .intro {
                font-size: 14px;
            }

            input,
            textarea,
            button {
                font-size: 16px;
            }

            textarea {
                min-height: 100px;
            }
        }
        @media screen and (max-width: 360px) {
            .page-container {
                padding: 15px 10px;
            }

            .contact-box {
                padding: 18px 14px;
            }

            h1 {
                font-size: 22px;
            }

            .intro {
                font-size: 13px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="home page.html">Home</a>
        <a href="about.html">About</a>
        <a href="product.html">Product</a>
        <a href="contact.html"
           class="active"
           aria-current="page">Contact</a>
    </nav>
    <main class="page-container">

        <div class="contact-box">

            <h1>Contact Us!</h1>

            <p class="intro">
                If you have any questions about our products,
                don't hesitate to contact us!
            </p>

            <form id="contactForm">

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here"
                    required
                ></textarea>

                <button type="submit" class="send-button">
                    Send Message
                </button>

                <p id="formNotice"
                   role="status"
                   aria-live="polite"
                   style="margin-top:15px; margin-bottom:0;">
                </p>

            </form>

        </div>

    </main>

    <script>
        document.getElementById("contactForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("formNotice").textContent =
                    "Your form is ready, but sending messages requires a backend or email service.";
            });
    </script>

</body>
</html>
