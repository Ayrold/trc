

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRC Shop Login</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* BODY / BACKGROUND */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("background image.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #333;

            overflow-x: hidden;
        }

        /* OPTIONAL DARK OVERLAY FOR BETTER CONTRAST */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        /* LOGIN CARD */
        .login-box {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 380px;
            padding: 32px;

            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* LOGO */
        .login-logo {
            display: block;

            width: 80px;
            height: 80px;
            max-width: 100%;

            object-fit: contain;
            margin: 0 auto 15px;
        }

        /* TITLE */
        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #222;
        }

        /* FORM */
        form {
            width: 100%;
        }

        /* INPUT FIELDS */
        input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            margin: 15px 0;

            border: 1px solid #ccc;
            border-radius: 6px;

            background: #fff;
            color: #222;
            font-size: 16px;

            outline: none;
            transition: border-color 0.2s,
                        box-shadow 0.2s;
        }

        input::placeholder {
            color: #666;
            opacity: 1;
        }

        input:focus {
            border-color: #d71920;
            box-shadow: 0 0 5px rgba(215, 25, 32, 0.3);
        }

        /* LOGIN BUTTON */
        button {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 13px;
            margin-top: 20px;

            background: #d71920;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: background 0.2s,
                        transform 0.2s;
        }

        button:hover {
            background: #a91218;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
        }

        /* TABLETS */
        @media screen and (max-width: 768px) {
            body {
                padding: 24px;
            }

            .login-box {
                max-width: 360px;
                padding: 30px 26px;
            }

            h1 {
                font-size: 26px;
            }
        }

        /* MOBILE PHONES */
        @media screen and (max-width: 480px) {
            body {
                padding: 16px;
                background-position: center;
            }

            .login-box {
                width: 100%;
                max-width: 360px;
                padding: 26px 20px;
                border-radius: 10px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            input {
                min-height: 46px;
                margin: 12px 0;
                padding: 12px;
                font-size: 16px;
            }

            button {
                min-height: 46px;
                margin-top: 16px;
                font-size: 16px;
            }
        }

        /* EXTRA SMALL PHONES */
        @media screen and (max-width: 320px) {
            body {
                padding: 10px;
            }

            .login-box {
                padding: 22px 15px;
            }

            .login-logo {
                width: 60px;
                height: 60px;
            }

            h1 {
                font-size: 22px;
            }
        }

        /* SHORT SCREENS / LANDSCAPE PHONES */
        @media screen and (max-height: 500px) {
            body {
                align-items: flex-start;
            }

            .login-box {
                margin: 10px auto;
            }
        }

        /* ACCESSIBILITY */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <img
            src="trc logo.jpg"
            alt="TRC Shop Logo"
            class="login-logo"
        >

        <h1>TRC Shop</h1>

        <form onsubmit="login(event)">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                aria-label="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

    </main>

    <script>
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username === "ayrold" && password === "12345") {
                window.location.href = "home page.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>

</body>
</html>
