
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRC Shop Login</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            width: 100%;
        }

        /* BODY / BACKGROUND */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.3),
                    rgba(0, 0, 0, 0.3)
                ),
                url("background image.jpg") center / cover no-repeat;

            background-color: #333;
            overflow-x: hidden;
        }

        /* LOGIN BOX */
        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 30px;

            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 12px;

            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        }

        /* LOGO */
        .login-logo {
            display: block;
            width: 80px;
            height: 80px;
            max-width: 100%;

            object-fit: contain;
            margin: 0 auto 12px;
        }

        /* TITLE */
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #222;
        }

        /* FORM */
        form {
            width: 100%;
        }

        /* INPUT FIELDS */
        input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px;
            margin: 12px 0;

            border: 1px solid #ccc;
            border-radius: 6px;

            background: #fff;
            color: #222;
            font-size: 16px;
        }

        input::placeholder {
            color: #666;
            opacity: 1;
        }

        input:focus {
            outline: 2px solid #d71920;
            outline-offset: 1px;
            border-color: #d71920;
        }

        /* LOGIN BUTTON */
        button {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px;
            margin-top: 15px;

            background: #d71920;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        button:hover {
            background: #a91218;
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
        }

        /* TABLETS */
        @media screen and (max-width: 768px) {
            body {
                padding: 12px;
            }

            .login-box {
                max-width: 420px;
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }

        /* CELLPHONES */
        @media screen and (max-width: 480px) {
            body {
                padding: 6px;
            }

            .login-box {
                width: 100%;
                max-width: none;
                padding: 22px 16px;
                border-radius: 10px;
            }

            .login-logo {
                width: 65px;
                height: 65px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 15px;
            }

            input {
                width: 100%;
                min-height: 46px;
                margin: 10px 0;
                padding: 11px;
                font-size: 16px;
            }

            button {
                width: 100%;
                min-height: 46px;
                margin-top: 12px;
                padding: 11px;
                font-size: 16px;
            }
        }

        /* EXTRA SMALL CELLPHONES */
        @media screen and (max-width: 320px) {
            body {
                padding: 4px;
            }

            .login-box {
                padding: 18px 12px;
                border-radius: 8px;
            }

            .login-logo {
                width: 55px;
                height: 55px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 12px;
            }

            input {
                min-height: 44px;
                margin: 9px 0;
                padding: 10px;
            }

            button {
                min-height: 44px;
                margin-top: 10px;
            }
        }

        /* LANDSCAPE PHONES / SHORT SCREENS */
        @media screen and (max-height: 500px) {
            body {
                align-items: flex-start;
                padding-top: 6px;
                padding-bottom: 6px;
            }

            .login-box {
                margin: 4px auto;
                padding-top: 16px;
                padding-bottom: 16px;
            }

            .login-logo {
                width: 50px;
                height: 50px;
                margin-bottom: 6px;
            }

            h1 {
                margin-bottom: 10px;
            }

            input {
                margin: 8px 0;
            }

            button {
                margin-top: 10px;
            }
        }

        /* REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <!-- TRC LOGO -->
        <img
            src="trc logo.jpg"
            alt="TRC Shop Logo"
            class="login-logo"
        >

        <!-- TITLE -->
        <h1>TRC Shop</h1>

        <!-- LOGIN FORM -->
        <form onsubmit="login(event)">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                aria-label="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

    </main>

    <!-- LOGIN SCRIPT -->
    <script>
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (
                username === "ayrold" &&
                password === "12345"
            ) {
                window.location.href = "home page.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>

</body>
</html>
