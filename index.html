<!DOCTYPE html>
<html>
<head>
    <title>Login Website</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("background image.jpg");
            background-size: cover;
            background-position: center;
        }
        .login-box {
            width: 300px;
			min-height: 350;
            padding: 30px;
			margin: 50px auto;
            box-sizing: border-box;
			text-align: center;
			background: white;
			boder-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        /* Style for your new logo */
        .login-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            
        }
        h1 {
            margin-bottom: 25px;
            margin-top: 0;
            font-size: 24px;
        }
        input {
		    display: block;
            width: 100%;
			box-sizing: border-box;
            padding: 12px;
			margin: 12px 0;
            border: 1px solid #ccc;
			border-radius: 5px;
            
        }
        login-box input::placeholder {
            color: #666;
			opacity: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #d71920;;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
	<div class="login-box">
       
        <img src="trc logo.jpg" alt="Logo" class="login-logo" onerror="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNF2RTILV6K_MTX7MM8Hcp-v-tQTwUIn04LqCbBQO4BQ&s=10'">
        
        <h1>Trc Shop</h1>
        <form onsubmit="login(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <script>
	
        function login(event) {
            event.preventDefault();
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            if (username === "ayrold" && password === "12345") {
                window.location.href = "home page.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>
</body>
</html>
