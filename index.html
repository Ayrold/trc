<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   viewport-fit=cover">

    <title>TRC Shop Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("background image.jpg")
                center center / cover no-repeat;

            background-color: #333;
            overflow-x: hidden;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            padding: 28px 22px;

            text-align: center;

            background: rgba(255, 255, 255, 0.97);
            border-radius: 16px;

            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        }

        .login-logo {
            display: block;
            width: 76px;
            height: 76px;
            max-width: 100%;

            object-fit: contain;
            margin: 0 auto 12px;
        }

        h1 {
            margin-bottom: 22px;
            font-size: 28px;
            line-height: 1.2;
            color: #222;
        }

        form {
            width: 100%;
        }

        input {
            display: block;
            width: 100%;
            height: 48px;
            padding: 0 13px;
            margin: 12px 0;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: #fff;
            color: #222;
            font-size: 16px;
        }

        input::placeholder {
            color: #666;
            opacity: 1;
        }

        input:focus {
            outline: 2px solid #d71920;
            outline-offset: 1px;
            border-color: #d71920;
        }

        button {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px;
            margin-top: 16px;

            background: #d71920;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        button:hover {
            background: #a91218;
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
        }

        /* Small Android phones */
        @media screen and (max-width: 480px) {
            .login-box {
                width: 100%;
                max-width: 360px;
                padding: 25px 18px;
                border-radius: 14px;
            }

            .login-logo {
                width: 68px;
                height: 68px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 18px;
            }

            input,
            button {
                font-size: 16px;
            }
        }

        /* Extra-small screens */
        @media screen and (max-width: 340px) {
            body {
                padding: 8px;
            }

            .login-box {
                padding: 20px 14px;
            }

            .login-logo {
                width: 58px;
                height: 58px;
            }

            h1 {
                font-size: 23px;
                margin-bottom: 14px;
            }

            input {
                height: 45px;
                margin: 10px 0;
                padding: 0 10px;
            }

            button {
                min-height: 45px;
                margin-top: 12px;
            }
        }

        /* Landscape mode / short screens */
        @media screen and (max-height: 500px) {
            body {
                align-items: flex-start;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .login-box {
                margin: auto;
                padding: 14px 20px;
            }

            .login-logo {
                width: 42px;
                height: 42px;
                margin-bottom: 5px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 10px;
            }

            input {
                height: 42px;
                margin: 8px 0;
            }

            button {
                min-height: 42px;
                margin-top: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <img
            src="trc logo.jpg"
            alt="TRC Shop Logo"
            class="login-logo"
        >

        <h1>TRC Shop</h1>

        <form onsubmit="login(event)">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                aria-label="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

    </main>

    <script>
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (
                username === "ayrold" &&
                password === "12345"
            ) {
                window.location.href = "home page.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>

</body>
</html>
